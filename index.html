<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reconhecimento de Encomendas - Teste IA</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 16px;
    min-height: 100vh;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: #f8fafc;
  }
  p.subtitle {
    color: #94a3b8;
    font-size: 13px;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #cbd5e1;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
  }
  .key-hint {
    font-size: 11px;
    color: #64748b;
    margin-top: 4px;
  }
  .capture-btn {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
  }
  .capture-btn:active { background: #1d4ed8; }
  .capture-btn:disabled { background: #334155; color: #64748b; }
  input[type="file"] { display: none; }
  #preview {
    width: 100%;
    border-radius: 12px;
    margin-top: 14px;
    display: none;
    max-height: 280px;
    object-fit: cover;
  }
  #status {
    margin-top: 14px;
    font-size: 13px;
    color: #94a3b8;
    display: none;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #334155;
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #result {
    margin-top: 16px;
    display: none;
  }
  .result-field {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .result-field .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
    margin-bottom: 4px;
  }
  .result-field .value {
    font-size: 16px;
    color: #f8fafc;
    font-weight: 600;
  }
  .confidence {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .conf-alta { background: #14532d; color: #86efac; }
  .conf-media { background: #713f12; color: #fde68a; }
  .conf-baixa { background: #7f1d1d; color: #fca5a5; }
  #error {
    display: none;
    margin-top: 14px;
    background: #7f1d1d;
    color: #fecaca;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
  }
  .reset-btn {
    display: none;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 1px solid #334155;
    border-radius: 10px;
    background: transparent;
    color: #94a3b8;
    font-size: 14px;
  }
  #cameraWrap {
    display: none;
    margin-top: 14px;
  }
  #video {
    width: 100%;
    border-radius: 12px;
    background: #000;
    max-height: 360px;
    object-fit: cover;
  }
  .camera-controls {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .snap-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    font-size: 15px;
    font-weight: 600;
  }
  .cancel-btn {
    padding: 14px 18px;
    border: 1px solid #334155;
    border-radius: 10px;
    background: transparent;
    color: #94a3b8;
    font-size: 15px;
  }
  .fallback-link {
    display: none;
    text-align: center;
    font-size: 13px;
    color: #60a5fa;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>📦 Reconhecimento de Encomendas</h1>
  <p class="subtitle">Protótipo de teste — leitura de etiqueta via IA (Gemini)</p>

  <label for="apiKey">Chave da API do Gemini</label>
  <input type="password" id="apiKey" placeholder="Cole sua API key aqui">
  <div class="key-hint">Gere gratuitamente em aistudio.google.com. Fica salva só neste aparelho.</div>

  <button type="button" class="capture-btn" id="captureBtn">📷 Tirar foto da etiqueta</button>
  <input type="file" id="fileInput" accept="image/*">

  <div id="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="camera-controls">
      <button type="button" class="snap-btn" id="snapBtn">Capturar</button>
      <button type="button" class="cancel-btn" id="cancelCameraBtn">Cancelar</button>
    </div>
  </div>

  <a href="#" class="fallback-link" id="fallbackLink">A câmera não abriu? Escolher foto da galeria</a>

  <img id="preview" alt="Prévia da foto">

  <div id="status"><span class="spinner"></span><span id="statusText">Analisando...</span></div>

  <div id="result"></div>

  <div id="error"></div>

  <button type="button" class="reset-btn" id="resetBtn">Tirar outra foto</button>
</div>

<script>
const apiKeyInput = document.getElementById('apiKey');
const captureBtn = document.getElementById('captureBtn');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const resultEl = document.getElementById('result');
const errorEl = document.getElementById('error');
const resetBtn = document.getElementById('resetBtn');
const cameraWrap = document.getElementById('cameraWrap');
const video = document.getElementById('video');
const snapBtn = document.getElementById('snapBtn');
const cancelCameraBtn = document.getElementById('cancelCameraBtn');
const fallbackLink = document.getElementById('fallbackLink');

let currentStream = null;

// Salva a chave localmente (só neste navegador) pra não precisar colar toda vez
const savedKey = localStorage.getItem('gemini_api_key');
if (savedKey) apiKeyInput.value = savedKey;
apiKeyInput.addEventListener('change', () => {
  localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
});

captureBtn.addEventListener('click', async () => {
  const key = apiKeyInput.value.trim();
  if (!key) {
    showError('Cole sua API key do Gemini antes de tirar a foto.');
    apiKeyInput.focus();
    return;
  }
  errorEl.style.display = 'none';
  await abrirCamera();
});

async function abrirCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('Este navegador não suporta câmera embutida. Use o link abaixo para escolher da galeria.');
    fallbackLink.style.display = 'block';
    return;
  }
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });
    video.srcObject = currentStream;
    cameraWrap.style.display = 'block';
    captureBtn.style.display = 'none';
    preview.style.display = 'none';
    resultEl.style.display = 'none';
  } catch (err) {
    showError('Não consegui abrir a câmera (' + err.message + '). Use o link abaixo para escolher da galeria.');
    fallbackLink.style.display = 'block';
  }
}

function pararCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
  cameraWrap.style.display = 'none';
  captureBtn.style.display = 'block';
}

cancelCameraBtn.addEventListener('click', pararCamera);

snapBtn.addEventListener('click', async () => {
  const canvas = document.createElement('canvas');
  const maxDim = 1200;
  let { videoWidth: width, videoHeight: height } = video;
  if (width > height && width > maxDim) {
    height = Math.round(height * (maxDim / width));
    width = maxDim;
  } else if (height > maxDim) {
    width = Math.round(width * (maxDim / height));
    height = maxDim;
  }
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(video, 0, 0, width, height);
  const base64 = canvas.toDataURL('image/jpeg', 0.8);

  pararCamera();
  await processarFotoBase64(base64);
});

fallbackLink.addEventListener('click', (e) => {
  e.preventDefault();
  const key = apiKeyInput.value.trim();
  if (!key) {
    showError('Cole sua API key do Gemini antes de escolher a foto.');
    apiKeyInput.focus();
    return;
  }
  fileInput.click();
});

resetBtn.addEventListener('click', () => {
  resultEl.style.display = 'none';
  resultEl.innerHTML = '';
  errorEl.style.display = 'none';
  fallbackLink.style.display = 'none';
  preview.style.display = 'none';
  resetBtn.style.display = 'none';
  captureBtn.style.display = 'block';
  captureBtn.disabled = false;
});

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) {
    showError('Nenhuma imagem foi selecionada.');
    return;
  }
  const base64 = await comprimirImagem(file, 1200, 0.8);
  await processarFotoBase64(base64);
});

async function processarFotoBase64(base64) {
  errorEl.style.display = 'none';
  resultEl.style.display = 'none';
  resultEl.innerHTML = '';

  preview.src = base64;
  preview.style.display = 'block';

  captureBtn.disabled = true;
  statusEl.style.display = 'block';
  statusText.textContent = 'Analisando etiqueta...';

  try {
    const key = apiKeyInput.value.trim();
    const data = await reconhecerEtiqueta(base64, key);
    mostrarResultado(data);
  } catch (err) {
    showError('Erro ao consultar a IA: ' + err.message);
  } finally {
    statusEl.style.display = 'none';
    captureBtn.disabled = false;
    captureBtn.style.display = 'block';
    resetBtn.style.display = 'block';
  }
}

function comprimirImagem(file, maxDim, qualidade) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function reconhecerEtiqueta(base64DataUrl, apiKey) {
  const base64Data = base64DataUrl.split(',')[1];
  const mimeType = base64DataUrl.split(';')[0].split(':')[1];

  const prompt = `Você está analisando a foto de uma etiqueta de encomenda/pacote recebido em uma portaria no Brasil.

Extraia as seguintes informações:
1. "destinatario": o nome completo da pessoa que vai receber o pacote (procure por campos como "Destinatário", "Para", "Nome" ou o nome mais destacado na etiqueta).
2. "origem": de qual loja, marketplace ou transportadora o pacote veio. Considere estas opções mais comuns e tente identificar pela logo, cores, código de barras ou texto: Mercado Livre, Shopee, Shein, Temu, Amazon, Correios, Jadlog, Loggi, Total Express, Kwai, AliExpress. Se não conseguir identificar com confiança, retorne "Não identificado".
3. "confianca": sua confiança geral na leitura, uma das opções: "alta", "media" ou "baixa".
4. "observacao": qualquer detalhe relevante (ex: foto borrada, etiqueta cortada, nome parcialmente ilegível), ou string vazia se não houver nada a observar.

Responda APENAS com um JSON válido, sem markdown, sem crases, sem texto antes ou depois, no formato exato:
{"destinatario": "...", "origem": "...", "confianca": "...", "observacao": "..."}`;

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: mimeType, data: base64Data } }
          ]
        }]
      })
    }
  );

  if (!response.ok) {
    const errBody = await response.text();
    throw new Error(`API retornou ${response.status}: ${errBody.slice(0, 200)}`);
  }

  const json = await response.json();
  const text = json.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error('Resposta vazia da IA.');

  const cleaned = text.replace(/```json|```/g, '').trim();
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    throw new Error('Não consegui interpretar a resposta da IA: ' + cleaned.slice(0, 150));
  }
}

function mostrarResultado(data) {
  const confClass = data.confianca === 'alta' ? 'conf-alta'
                   : data.confianca === 'media' ? 'conf-media'
                   : 'conf-baixa';

  resultEl.innerHTML = `
    <div class="result-field">
      <div class="label">Destinatário</div>
      <div class="value">${escapeHtml(data.destinatario || '—')}</div>
    </div>
    <div class="result-field">
      <div class="label">Origem</div>
      <div class="value">${escapeHtml(data.origem || '—')}</div>
      <span class="confidence ${confClass}">Confiança: ${escapeHtml(data.confianca || '—')}</span>
    </div>
    ${data.observacao ? `<div class="result-field"><div class="label">Observação</div><div class="value" style="font-size:13px;font-weight:400;">${escapeHtml(data.observacao)}</div></div>` : ''}
  `;
  resultEl.style.display = 'block';
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
